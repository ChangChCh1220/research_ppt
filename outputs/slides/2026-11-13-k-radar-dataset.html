      padding: 0;

    }

    .slide-wrapper {
      width: 100vw;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;

      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-sizing: border-box;
      padding: 44px 56px;
    }

    .ice-card {
      background-color: #F4F8FF;
      border: 1px solid #DBEAFE;
      border-radius: 14px;
      padding: 18px 22px;
    }

    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }

    /* Print Style for PDF Export (Ctrl+P) */
    @media print {
      body {
        background: #FFFFFF !important;
        padding: 0 !important;
      }
      .no-print {
        display: none !important;
      }
      .slide-wrapper {
        padding: 0 !important;
        min-height: auto !important;
      }
      .slide-canvas {
        page-break-after: always;
        break-after: page;
        box-shadow: none !important;
        border: none !important;
        border-radius: 0 !important;
        max-width: 100% !important;
        width: 100vw !important;
        height: 100vh !important;
        aspect-ratio: auto !important;

                  <div class="text-xs font-bold text-slate-800">RadarXFormer (2026)</div>
                  <div class="text-[11px] text-slate-500">4D 雷達原始光譜與相機跨維度融合 (arXiv:2603.14822)</div>
                </div>
                <a href="https://arxiv.org/pdf/2603.14822.pdf" target="_blank" class="px-2.5 py-1 rounded bg-blue-600 text-white text-[11px] font-semibold mono hover:bg-blue-700">下載 PDF</a>
              </div>
            </div>
          </div>

          <div class="flex justify-between text-xs text-slate-400 border-t border-slate-100 pt-2.5">
            <span>報告完畢 · 歡迎交流討論</span>
            <span class="mono">Q&A · Thank You</span>
          </div>
        `,
        notes: "總結來說，K-Radar 為整個 4D 毫米波雷達研究樹立了里程碑。它證明了高度資訊的不可或缺、展現了極端天氣下的強健性，並透過 4DSRT 給出了 5% 能量密度的最佳實務。針對剛才提到的缺口，我也整理了三篇專門基於 K-Radar 的最新文獻，都附上了直接下載 PDF 的連結，後續我們可以把它們收進知識庫中繼續探索。謝謝大家！"
      }
    ];

    let currentSlide = 0;
    let showNotes = false;

    function renderSlide() {
      const stage = document.getElementById('slideStage');
      stage.innerHTML = slides[currentSlide].render();
      document.getElementById('slideCounter').textContent = `${String(currentSlide + 1).padStart(2, '0')} / ${String(slides.length).padStart(2, '0')}`;
      document.getElementById('speakerNotesText').textContent = slides[currentSlide].notes;

      // Re-trigger KaTeX rendering for dynamic content
      if (window.renderMathInElement) {
        renderMathInElement(stage, {
          delimiters: [
            {left: '$$', right: '$$', display: true},
            {left: '$', right: '$', display: false}
          ],
          throwOnError: false
        });
      }
    }

    function nextSlide() {
      if (currentSlide < slides.length - 1) {
        currentSlide++;
        renderSlide();
      }
    }

    function prevSlide() {
      if (currentSlide > 0) {
        currentSlide--;
        renderSlide();
      }
    }

    function toggleNotes() {
      showNotes = !showNotes;
      const panel = document.getElementById('speakerNotesPanel');
      panel.classList.toggle('hidden', !showNotes);
    }

    // Keyboard Shortcuts
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') {
        e.preventDefault();
        nextSlide();
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevSlide();
      } else if (e.key.toLowerCase() === 's') {
        e.preventDefault();
        toggleNotes();
      } else if (e.key.toLowerCase() === 'f') {
        e.preventDefault();
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen();
        } else {
          document.exitFullscreen();
        }
      }
    });

    // Initial render
    window.addEventListener('DOMContentLoaded', () => {
      renderSlide();
    });
  </script>
</body>
