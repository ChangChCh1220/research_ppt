              <div class="p-2.5 rounded-xl bg-white border border-slate-200 flex items-center justify-between">
                <div>
                  <div class="text-xs font-bold text-slate-800">RAF (arXiv:2607.04587)</div>
                  <div class="text-[11px] text-slate-500">全天候畫素/實例級可靠度動態加權監督機制</div>
                </div>
                <a href="https://arxiv.org/pdf/2607.04587.pdf" target="_blank" class="px-2.5 py-1 rounded bg-blue-600 text-white text-[11px] font-semibold mono hover:bg-blue-700">下載 PDF</a>
              </div>
            </div>
          </div>

          <div class="flex justify-between text-xs text-slate-400 border-t border-slate-100 pt-2.5">
            <span>報告完畢 · 歡迎交流討論</span>
            <span class="mono">Q&A · Thank You</span>
          </div>
        `,
        notes: "最後總結：軟式去噪是 4D 毫米波雷達邁向高精度與保留小目標的核心方向。透過連續可靠度調變，我們能在抑制雜訊的同時保全珍貴的邊緣結構。針對剛才提出的研究缺口，我整理了四篇最新的前沿文獻，都附上了直接下載 PDF 的連結，後續我們可以將其存入 raw 資料夾進行 Wiki 化，進一步豐富我們的研究體系。謝謝大家！"
      }
    ];

    let currentSlide = 0;
    let showNotes = false;

    function renderSlide() {
      const stage = document.getElementById('slideStage');
      stage.innerHTML = slides[currentSlide].render();
      document.getElementById('slideCounter').textContent = `${String(currentSlide + 1).padStart(2, '0')} / ${String(slides.length).padStart(2, '0')}`;
      document.getElementById('speakerNotesText').textContent = slides[currentSlide].notes;

      // Re-trigger KaTeX rendering for dynamic content
      if (window.renderMathInElement) {
        renderMathInElement(stage, {
          delimiters: [
            {left: '$$', right: '$$', display: true},
            {left: '$', right: '$', display: false}
          ],
          throwOnError: false
        });
      }
    }

    function nextSlide() {
      if (currentSlide < slides.length - 1) {
        currentSlide++;
        renderSlide();
      }
    }

    function prevSlide() {
      if (currentSlide > 0) {
        currentSlide--;
        renderSlide();
      }
    }

    function toggleNotes() {
      showNotes = !showNotes;
      const panel = document.getElementById('speakerNotesPanel');
      panel.classList.toggle('hidden', !showNotes);
    }

    // Keyboard Shortcuts
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') {
        e.preventDefault();
        nextSlide();
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevSlide();
      } else if (e.key.toLowerCase() === 's') {
        e.preventDefault();
        toggleNotes();
      } else if (e.key.toLowerCase() === 'f') {
        e.preventDefault();
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen();
        } else {
          document.exitFullscreen();
        }
      }
    });

    // Initial render
    window.addEventListener('DOMContentLoaded', () => {
      renderSlide();
    });
  </script>
