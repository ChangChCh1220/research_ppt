    function updateSlide() {
      const slide = slides[currentSlide];
      stage.innerHTML = slide.render(
        String(currentSlide + 1).padStart(2, '0'),
        String(slides.length).padStart(2, '0')
      );
      speakerContent.innerText = slide.speaker;
      currentIdx.innerText = String(currentSlide + 1).padStart(2, '0');
      totalIdx.innerText = String(slides.length).padStart(2, '0');
      progressBar.style.width = ((currentSlide + 1) / slides.length * 100) + '%';
      
      if (window.renderMathInElement) {
        renderMathInElement(stage, {
          delimiters: [
            {left: '$$', right: '$$', display: true},
            {left: '$', right: '$', display: false}
          ],
          throwOnError: false
        });
      }
    }

    function nextSlide() {
      if (currentSlide < slides.length - 1) {
        currentSlide++;
        updateSlide();
      }
    }

    function prevSlide() {
      if (currentSlide > 0) {
        currentSlide--;
        updateSlide();
      }
    }

    function toggleSpeakerNotes() {
      speakerDrawer.classList.toggle('hidden');
    }

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
          alert(`Error attempting to enable full-screen mode: ${err.message}`);
        });
      } else {
        document.exitFullscreen();
      }
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
        e.preventDefault();
        nextSlide();
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        e.preventDefault();
        prevSlide();
      } else if (e.key.toLowerCase() === 's') {
        toggleSpeakerNotes();
      } else if (e.key.toLowerCase() === 'f') {
        toggleFullScreen();
      }
    });

    window.addEventListener('load', () => {
      updateSlide();
    });
