    let currentSlide = 1;
    const totalSlides = slides.length;
    function renderSlide(index) {
      if (index < 1 || index > totalSlides) return;
      currentSlide = index;
      const stage = document.getElementById('slideStage');
      stage.innerHTML = slides[currentSlide - 1].render(currentSlide, totalSlides);
      document.getElementById('currentIdx').textContent = String(currentSlide).padStart(2, '0');
      document.getElementById('totalIdx').textContent = String(totalSlides).padStart(2, '0');
      document.getElementById('progressBar').style.width = ((currentSlide / totalSlides) * 100) + '%';
      document.getElementById('speakerContent').textContent = slides[currentSlide - 1].notes;
      if (typeof renderMathInElement === 'function') {
        renderMathInElement(stage, { delimiters: [{left: '$$', right: '$$', display: true}, {left: '$', right: '$', display: false}], throwOnError: false });
      }
    }
    function nextSlide() { if (currentSlide < totalSlides) renderSlide(currentSlide + 1); }
    function prevSlide() { if (currentSlide > 1) renderSlide(currentSlide - 1); }
    function toggleSpeakerNotes() { document.getElementById('speakerDrawer').classList.toggle('hidden'); }
    function toggleFullScreen() { if (!document.fullscreenElement) { document.documentElement.requestFullscreen().catch(()=>{}); } else { if (document.exitFullscreen) document.exitFullscreen(); } }
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === 'Space') { e.preventDefault(); nextSlide(); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); prevSlide(); }
      else if (e.key === 's' || e.key === 'S') { e.preventDefault(); toggleSpeakerNotes(); }
      else if (e.key === 'f' || e.key === 'F') { e.preventDefault(); toggleFullScreen(); }
    });
    window.addEventListener('DOMContentLoaded', () => { renderSlide(1); });
  </script>
