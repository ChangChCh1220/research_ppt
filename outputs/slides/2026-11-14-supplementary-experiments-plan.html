        e.preventDefault();
        prevSlide();
      } else if (e.key.toLowerCase() === 's') {
        toggleSpeakerNotes();
      } else if (e.key.toLowerCase() === 'f') {
        toggleFullScreen();
      }
    });

    window.addEventListener('load', () => {
      updateSlide();
    });
  </script>
</body>
</html>
