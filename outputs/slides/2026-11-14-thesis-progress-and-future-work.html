      else if (index >= 9 && index <= 11) select.value = "9";
      else if (index >= 12 && index <= 14) select.value = "12";
      else if (index >= 15 && index <= 20) select.value = "15";
      else if (index >= 21) select.value = "21";
    }

    function nextSlide() {
      if (currentSlide < totalSlides) {
        renderSlide(currentSlide + 1);
      }
    }

    function prevSlide() {
      if (currentSlide > 1) {
        renderSlide(currentSlide - 1);
      }
    }

    function jumpToSlide(page) {
      renderSlide(page);
    }

    function toggleSpeakerNotes() {
      const drawer = document.getElementById('speakerDrawer');
      drawer.classList.toggle('hidden');
    }

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    // 鍵盤導航
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === 'Space' || e.key === 'PageDown') {
        e.preventDefault();
        nextSlide();
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        e.preventDefault();
        prevSlide();
      } else if (e.key === 's' || e.key === 'S') {
        e.preventDefault();
        toggleSpeakerNotes();
      } else if (e.key === 'f' || e.key === 'F') {
        e.preventDefault();
        toggleFullScreen();
      }
    });

    // 初始化渲染第一頁
    window.addEventListener('DOMContentLoaded', () => {
      renderSlide(1);
    });
  </script>
</body>
</html>
